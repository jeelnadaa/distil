<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" class="mark--animate" role="img" aria-label="Distil (Converge, animated)">
<title>Distil (Converge, animated)</title>
<style>
.mark--animate * { transform-box: fill-box; }
.mark--animate .mk-bar { transform-origin: center; animation: mk-condense 2.8s cubic-bezier(.7, 0, .2, 1) infinite; }
.mark--animate .mk-bar--2 { animation-delay: .12s; }
.mark--animate .mk-bar--3 { animation-delay: .24s; }
.mark--animate .mk-drop { transform-origin: center bottom; animation: mk-drop 2.8s infinite; }
.mark--animate .mk-stem { transform-origin: center top; animation: mk-stem 2.8s cubic-bezier(.7, 0, .2, 1) infinite; }
.mark--animate .mk-bowl { transform-origin: center bottom; animation: mk-bowl 2.8s infinite; }
.mark--animate .mk-core { transform-origin: center; animation: mk-core 2.8s infinite; }
.mark--animate .mk-line { stroke-dasharray: 1; animation: mk-line 2.8s cubic-bezier(.7, 0, .2, 1) infinite; animation-delay: calc(var(--n) * 60ms); }
@keyframes mk-condense {
  0%   { transform: scaleX(1.5); opacity: .25; }
  30%  { transform: scaleX(1); opacity: 1; }
  80%  { transform: scaleX(1); opacity: 1; }
  100% { transform: scaleX(1.5); opacity: .25; }
}
@keyframes mk-drop {
  0%, 30% { transform: translateY(-8px) scale(.2); opacity: 0; animation-timing-function: cubic-bezier(.5, 0, .9, .5); }
  46%     { transform: translateY(0) scale(1.08, .86); opacity: 1; animation-timing-function: cubic-bezier(.16, 1, .3, 1); }
  56%     { transform: translateY(-1px) scale(.96, 1.05); }
  64%, 82% { transform: none; opacity: 1; }
  100%    { transform: none; opacity: 0; }
}
@keyframes mk-stem {
  0%       { transform: scaleY(0); opacity: 0; }
  24%      { transform: scaleY(1); opacity: 1; }
  86%      { transform: scaleY(1); opacity: 1; }
  100%     { transform: scaleY(1); opacity: 0; }
}
@keyframes mk-bowl {
  0%, 16% { transform: translateY(-10px) scale(.5); opacity: 0; animation-timing-function: cubic-bezier(.5, 0, .9, .5); }
  38%     { transform: translateY(0) scale(1.04, .94); opacity: 1; animation-timing-function: cubic-bezier(.16, 1, .3, 1); }
  48%     { transform: scale(.99, 1.02); }
  56%, 86% { transform: none; opacity: 1; }
  100%    { transform: none; opacity: 0; }
}
@keyframes mk-core {
  0%, 44% { transform: scale(0); opacity: 0; }
  56%     { transform: scale(1.18); opacity: 1; animation-timing-function: cubic-bezier(.16, 1, .3, 1); }
  66%, 86% { transform: none; opacity: 1; }
  100%    { transform: none; opacity: 0; }
}
@keyframes mk-line {
  0%       { stroke-dashoffset: 1; opacity: .3; }
  34%      { stroke-dashoffset: 0; opacity: 1; }
  86%      { stroke-dashoffset: 0; opacity: 1; }
  100%     { stroke-dashoffset: 0; opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .mark--animate * { animation: none !important; }
  .mark--animate :is(.mk-drop, .mk-core) { animation: mk-breathe 2s ease-in-out infinite !important; }
}
</style>
      <g class="mk-lines" stroke="#15130F" stroke-width="2.2" stroke-linecap="round" fill="none">
        <path class="mk-line" style="--n:0" d="M4.5 4L12.6 18" pathLength="1"/><path class="mk-line" style="--n:1" d="M10.25 4L14.3 18" pathLength="1"/><path class="mk-line" style="--n:2" d="M16 4L16 18" pathLength="1"/><path class="mk-line" style="--n:3" d="M21.75 4L17.7 18" pathLength="1"/><path class="mk-line" style="--n:4" d="M27.5 4L19.4 18" pathLength="1"/>
      </g>
      <path class="mk-drop" d="M16 20C16 20 12.6 22.44 12.6 25.5A3.4 3.4 0 0 0 19.4 25.5C19.4 22.44 16 20 16 20Z" fill="#A8461A"/>
</svg>
