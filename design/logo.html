<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logo — Distil</title>
  <link rel="icon" href="assets/logo/distil-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/palettes.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/brand.css">
  <style>
    .logos { width: min(1180px, 100% - 32px); margin: 0 auto; padding: var(--s-8) 0 var(--s-9); display: grid; gap: var(--s-8); }
    .logos__top { display: flex; justify-content: space-between; align-items: center; }
    .dir { display: grid; gap: var(--s-4); padding-top: var(--s-5); border-top: 1px solid var(--text); }


    .dir__idea { max-width: 60ch; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-3); }
    .cell { border: 1px solid var(--border); border-radius: var(--r-md); padding: var(--s-5); display: grid; gap: var(--s-4); align-content: space-between; min-height: 240px; }
    .cell > .eyebrow { align-self: start; }
    .cell__art { display: flex; align-items: center; justify-content: center; gap: var(--s-5); flex-wrap: wrap; color: var(--text); }
    .cell--accent { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .cell--accent .eyebrow, .cell--accent .cell__art { color: var(--on-accent); }
    .sizes { display: flex; align-items: end; gap: var(--s-5); }
    .sizes figure { display: grid; justify-items: center; gap: var(--s-2); margin: 0; }
    .sizes figcaption { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }
    .lockup--big .wordmark { font-size: 54px; }
    .files { font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-4); }
    .files a { color: inherit; }
    .files a:hover { color: var(--accent); }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; }
  </style>
</head>
<body>
  <main class="logos">
    <div class="logos__top"><a href="index.html" data-slot="lockup" style="text-decoration:none"></a><button class="btn btn--ghost btn--icon btn--sm" data-theme-toggle aria-label="Toggle theme"></button></div>
    <header style="display:grid;gap:var(--s-3)">
      <p class="eyebrow">Brand · logo</p>
      <h1 class="display-xl" data-condense>Condense, <em>approved.</em></h1>
      <p class="body-lg muted" style="max-width:var(--measure)">Three strokes narrowing to a single drop: a syllabus condensing to its essence. The serif wordmark carries the same accent drops on its i's. Files live in <span class="mono">assets/logo/</span>.</p>
    </header>
    <section class="dir" data-sheet></section>
  </main>
  <script type="module">
    import { initTheme, toggleTheme, currentTheme, observeReveals } from "./js/motion.js";
    import { injectIcons, icon } from "./js/icons.js";
    import { initPalette } from "./js/palette.js";
    import { markSVG, iconTileSVG, lockupHTML } from "./js/brand.js";
    initTheme();
    initPalette();
    injectIcons();
    document.querySelector('[data-slot="lockup"]').innerHTML = lockupHTML({ size: 26 });
    const btn = document.querySelector("[data-theme-toggle]");
    const paint = () => { btn.innerHTML = icon(currentTheme() === "dark" ? "sun" : "moon", "icon icon--sm"); };
    paint();
    btn.addEventListener("click", () => { toggleTheme(); paint(); });

    const files = ["distil.svg", "distil-icon.svg", "distil-mono.svg", "distil-animated.svg"]
      .map((f) => `<a href="assets/logo/${f}" target="_blank">${f}</a>`).join("");
    document.querySelector("[data-sheet]").innerHTML = `
      <div class="grid">
        <div class="cell pal-scope" data-palette="copper" data-theme="light"><p class="eyebrow">Mark · light</p><div class="cell__art">${markSVG({ size: 128 })}</div></div>
        <div class="cell pal-scope" data-palette="copper" data-theme="dark"><p class="eyebrow">Mark · dark</p><div class="cell__art">${markSVG({ size: 128 })}</div></div>
        <div class="cell"><p class="eyebrow">Animated · loading &amp; hero</p><div class="cell__art">${markSVG({ size: 128, animated: true, label: "Distil, animated" })}</div></div>
        <div class="cell pal-scope" data-palette="copper" data-theme="light" style="grid-column: span 2"><p class="eyebrow">Lockup</p><div class="cell__art"><span class="lockup--big">${lockupHTML({ size: 60 })}</span></div></div>
        <div class="cell"><p class="eyebrow">App icon · favicon</p><div class="cell__art sizes">
          ${[96, 32, 16].map((s) => `<figure>${iconTileSVG({ size: s })}<figcaption>${s}</figcaption></figure>`).join("")}</div></div>
        <div class="cell"><p class="eyebrow">Small sizes</p><div class="cell__art sizes">
          ${[48, 32, 24, 16].map((s) => `<figure>${markSVG({ size: s, label: "" })}<figcaption>${s}</figcaption></figure>`).join("")}</div></div>
        <div class="cell"><p class="eyebrow">Monochrome</p><div class="cell__art">${markSVG({ size: 88, mono: true, label: "" })}</div></div>
        <div class="cell cell--accent"><p class="eyebrow">Mono on accent</p><div class="cell__art">${markSVG({ size: 88, mono: true, label: "" })}</div></div>
      </div>
      <p class="files">${files}</p>`;
    observeReveals();
  </script>
</body>
</html>
