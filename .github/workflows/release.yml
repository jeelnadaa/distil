# Every push to main that changes the app is tested, packaged and published as the latest release.
# The app's update feed points at releases/latest, so installed copies pick it up on their own.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "design/**"
      - "evals/**"
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Satoshi's licence allows it inside the app but not in a public repository.
      - name: Fetch fonts
        run: npm run fonts

      - name: Check and test
        run: |
          npm run check
          npm test

      # major.minor from package.json, patch from the run number, so every release is newer than the last.
      - name: Set version
        id: version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          version="$base.$GITHUB_RUN_NUMBER"
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package
        run: npm run package -- --feed "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/feed.json"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp "release/Distil-$VERSION-win-x64.zip" release/Distil-win-x64.zip
          gh release create "v$VERSION" \
            "release/Distil-$VERSION-win-x64.zip" \
            release/Distil-win-x64.zip \
            "release/app-$VERSION.zip" \
            release/feed.json \
            --target "$GITHUB_SHA" \
            --title "Distil $VERSION" \
            --generate-notes \
            --latest
